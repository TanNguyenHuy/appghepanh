name: GhepAnh
options:
  bundleIdPrefix: com.tannguyenhuy
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
targets:
  GhepAnh:
    type: application
    platform: iOS
    sources: [GhepAnh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tannguyenhuy.ghepanh
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ghép Ảnh
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Lưu ảnh ghép vào thư viện Ảnh khi bạn bấm Xong.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Hiển thị kho ảnh trong app để bạn chọn và chọn lặp lại ảnh cho từng ô ghép.
        INFOPLIST_KEY_NSPhotoLibraryPreventAutomaticLimitedAccessAlert: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '1.3'
        CURRENT_PROJECT_VERSION: '4'
    scheme:
      testTargets: [GhepAnhTests, GhepAnhUITests]
  GhepAnhTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GhepAnhTests]
    dependencies:
      - target: GhepAnh
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  GhepAnhUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GhepAnhUITests]
    dependencies:
      - target: GhepAnh
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
