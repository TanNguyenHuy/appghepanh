name: Build iPhone IPA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        shell: bash
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen generate --spec project.yml
      - name: Build device app without signing
        run: >-
          xcodebuild build -project GhepAnh.xcodeproj -scheme GhepAnh
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Pick simulator matching active Xcode SDK
        timeout-minutes: 3
        shell: bash
        run: |
          xcrun simctl list devices available -j > devices.json
          export SIMULATOR_SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          python3 - <<'PY'
          import json, os
          devices = json.load(open('devices.json'))['devices']
          runtime = 'com.apple.CoreSimulator.SimRuntime.iOS-' + os.environ['SIMULATOR_SDK_VERSION'].replace('.', '-')
          candidates = devices.get(runtime, [])
          selected = next(d for d in candidates if d['name'].startswith('iPhone'))
          print('Using', runtime, selected['name'], selected['state'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"SIMULATOR_ID={selected['udid']}\n")
              env.write(f"SIMULATOR_STATE={selected['state']}\n")
          PY
      - name: Boot selected simulator
        timeout-minutes: 5
        run: |
          if [ "$SIMULATOR_STATE" != "Booted" ]; then
            xcrun simctl boot "$SIMULATOR_ID"
          fi
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Test layouts and PNG output
        timeout-minutes: 8
        run: >-
          xcodebuild test -project GhepAnh.xcodeproj -scheme GhepAnh
          -destination "platform=iOS Simulator,id=$SIMULATOR_ID"
          -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA for sideload signing
        shell: bash
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GhepAnh.app Payload/
          zip -qr GhepAnh-unsigned.ipa Payload
          shasum -a 256 GhepAnh-unsigned.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GhepAnh-IPA
          path: |
            GhepAnh-unsigned.ipa
            SHA256.txt
          retention-days: 7
